<!DOCTYPE html>
<html>
    <head>
        <title>BERANDA</title>
    </head>
    <body>
        <h1 style="color: blue; font-size: 24px;">SELAMAT DATANG DI HALAMAN BERANDA</h1>
        <a href="about.html">Ke Halaman Tentang Kami</a>
        <br><br>
        <button onclick="BukaBuku()">Buka Buku Tamu</button>
        <br><br>
        <table id="bukuTamu" border="1" >
        <tr>
            <td>Nama</td>
            <td>Email</td>
            <td>Pesan</td>
        </tr>
        </table>
<script>
    function BukaBuku() {
            var Nama;
            Nama = prompt("Masukkan nama Anda:");
            var Email;
            Email = prompt("Masukkan email Anda:");
            var Pesan;
            Pesan = prompt("Masukkan pesan Anda:");

                var table = document.getElementById("bukuTamu").getElementsByTagName('tbody')[0];
                var row = table.insertRow();
                var cell1 = row.insertCell(0);
                var cell2 = row.insertCell(1);
                var cell3 = row.insertCell(2);

                cell1.textContent = Nama;
                cell2.textContent = Email;
                cell3.textContent = Pesan;
                alert("Data tidak lengkap, silakan coba lagi.");
        }
</script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Test Background color CSS</title>
<style type ="text/css">
    .warna {
        color: red;
    }
</style>
    </head>
<body>
    <p>
        CSS merupakan bahasanya <span class="warna">desainer web</span>.namun sebenarnya, 
        apa itu CSS?
        <br/>
        <span class="warna">CSS</span> adalah kumpulan kode 
        yang digunakan untuk mendefenisikan desain drai bahasa markup,
        <span class="warna">salah satunya adalah HTML</span>.
        <br/>
        dengan CSS kita bisa mengubah desain drai
        <span class="warna">text, warna , gambar, dan latar belakang</span>
        dari (hampir) semua kode tag HTML
    </p>
</body>
